version: '3.8'

services:
  espejo-ciudadano:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: espejo-ciudadano-dashboard
    ports:
      - "3838:3838"
    volumes:
      # Mount data directory for updates without rebuilding
      - ./data:/srv/shiny-server/espejo-ciudadano/data:ro
      # Mount logs for debugging
      - ./logs:/var/log/shiny-server
    environment:
      - SHINY_LOG_STDERR=1
      - APPLICATION_LOGS_TO_STDOUT=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits to prevent container from consuming too much memory
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'